name: Fetch product photos

# Downloads the official product photo for every machine in product-master.csv that has none yet,
# from its manufacturer page (scripts/fetch_brand_images.py), then commits. No Claude involved.
# Start it from the Actions tab, or (for Claude sessions) by pushing a change to .github/fetch-images.txt.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/fetch-images.txt"]

permissions:
  contents: write

concurrency:
  group: write-article
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Fetch photos
        run: |
          python scripts/fetch_brand_images.py | tee /tmp/fetch.log
          python scripts/build_data.py
          mkdir -p work/_runs
          { echo "# Fetch product photos — $(date -u '+%Y-%m-%d %H:%M UTC')"; echo '```'; cat /tmp/fetch.log; echo '```'; } > "work/_runs/$(date -u +%Y-%m-%d_%H%M)-images.md"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Product photos from manufacturer pages" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
