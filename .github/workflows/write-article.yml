name: Write the next article

# Sew & Hoop (sewandhoop.com) only. This workflow never touches any other repository or site.
#
# Runs the ten-agent pipeline in agents/ for the next page in data/schedule.json, then commits and pushes the
# article. The push makes Vercel rebuild, and the article goes live the same day (publishAt is stamped with
# today's US Eastern date just before the push).
#
# ONE article per day. Authentication uses CLAUDE_CODE_OAUTH_TOKEN (repository secret), so runs bill against
# the owner's Claude subscription — the same one the 3D Print Picks writer uses. To avoid both sites running at
# once or exhausting the usage window, this one only STARTS between 04:00 and 08:59 Pakistan time:
#
#   3D Print Picks writes at ~01:30 and ~09:00 PKT, and the owner uses Claude from ~14:00 PKT.
#   Sew & Hoop writes at 05:30 PKT (00:30 UTC).
#
# Primary trigger: an external cron (cron-job.org) calling workflow_dispatch at 00:30 UTC every day — GitHub's
# own scheduler can fire hours late. The schedule entries below are a fallback only: a late fallback that lands
# outside the window does nothing, and the daily cap stops a second article.
#
# A manual "Run workflow" from the Actions tab ignores the time window (it is the owner's own choice) but still
# writes only one article.

on:
  schedule:
    - cron: "30 23 * * *"   # 04:30 PKT fallback
    - cron: "45 1 * * *"    # 06:45 PKT fallback
  # Lets Claude sessions (which can push but cannot press "Run workflow") start a run: commit a change to
  # .github/run-now.txt. Optional first line = a page ID. Behaves like a manual run.
  push:
    branches: [main]
    paths: [".github/run-now.txt"]
  workflow_dispatch:
    inputs:
      page_id:
        description: "Page ID to write, e.g. S004 (blank = next in the queue)"
        type: string
        required: false

concurrency:
  group: write-article
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get install -y -qq poppler-utils >/dev/null   # pdftotext, for manufacturer manuals

      - name: Pick the page
        id: pick
        env:
          MAX_PER_DAY: "1"
          WINDOW_FIRST_HOUR_PKT: "4"
          WINDOW_LAST_HOUR_PKT: "8"
        run: |
          if [ -n "${{ inputs.page_id }}" ]; then
            echo "page=${{ inputs.page_id }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            want="$(head -n1 .github/run-now.txt | tr -d '[:space:]')"
            if echo "$want" | grep -qE '^S[0-9]+$'; then echo "page=$want" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          hour_pkt="$(TZ=Asia/Karachi date +%-H)"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour_pkt" -lt "$WINDOW_FIRST_HOUR_PKT" ] || [ "$hour_pkt" -gt "$WINDOW_LAST_HOUR_PKT" ]; }; then
            echo "::warning::Fallback schedule fired at ${hour_pkt}:xx PKT, outside the 0${WINDOW_FIRST_HOUR_PKT}:00–0${WINDOW_LAST_HOUR_PKT}:59 window. Nothing written. If no article appeared today, check the cron-job.org trigger."
            echo "page=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today="$(TZ=Asia/Karachi date +%F)"
          done_today="$(TZ=Asia/Karachi git log --since="$today 00:00" --format=%s origin/main | grep -c '^Article: S[0-9]* .*(ready)' || true)"
          echo "articles published today (PKT): $done_today (cap $MAX_PER_DAY)"
          if [ "$done_today" -ge "$MAX_PER_DAY" ]; then
            echo "daily cap reached - nothing to do"; echo "page=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python scripts/next_article.py || { echo "queue clear"; echo "page=" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "page=$(python scripts/next_article.py --id)" >> "$GITHUB_OUTPUT"

      - name: Run the pipeline
        id: pipeline
        if: steps.pick.outputs.page != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Write article ${{ steps.pick.outputs.page }} for Sew & Hoop (sewandhoop.com, USA) by running the engine
            that already exists in this repository. Do not invent a new process.

            RULE 0: this is the Sew & Hoop repository only. Never read, copy from or write to any other
            repository or site (in particular 3D Print Picks). Read CLAUDE.md first.

            0. If `work/<PageID>-<slug>/` already holds `02-research.md`, finished files under `05-sections/`, or
               new ledger rows for this page, a previous run stopped early -- continue from the first missing stage.
            1. `python scripts/run_pipeline.py ${{ steps.pick.outputs.page }} --prepare-only`, then read
               `work/<PageID>-<slug>/01-page-input.md`, `agents/README.md`, `agents/packs.md` and `agents/sew-score.md`.
            2. Work through `agents/01-scout.md` to `agents/10-publisher.md` in order, following each one exactly.
               Read a role file before you act as that agent. The Listener (03) runs before the Verifier calculates
               the Sew Score (02, step 5).
            3. Reuse anything already verified: a product-master row checked within 60 days is not re-researched and
               its claim IDs are reused. New claim IDs continue from the highest in `claim-ledger.csv`; new insight
               IDs from the highest in `review-insights.csv`. Run `python scripts/build_data.py` after ledger edits.
            4. Write the body one section at a time into `work/<page>/05-sections/`, then assemble. Every
               specification figure carries `<Cite id="C…" />`; every owner-experience sentence is wrapped in
               `<Owners id="R…">`.
            5. `python scripts/audit.py content/articles/<slug>.mdx` must exit 0 before the article is marked ready.
               Fix what it reports; never weaken a check. Up to three repair cycles, then leave it at status: draft
               with the reasons in `work/<page>/07-quality-report.md`.
            6. `python scripts/build_data.py`, then `npm run build`. Do not commit a build that fails.
            7. Commit with the message `Article: <PageID> <title> (<status>)` where status is ready, draft or
               hold-sources. Do not push -- the workflow pushes.
            8. Blocked sources are NOT a reason to stop: follow the "Source fallbacks" in the agent files. Stop
               with hold-sources only if fewer than 4 products (buying guides) or the reviewed product itself
               (reviews) cannot be verified after every fallback.

            Hard rules:
            - USA, Amazon.com, American English, US-dollar price bands only. Never an exact live-looking price.
            - Never imply first-hand testing. Never quote a customer review or reproduce a rating.
            - The body links out only to Amazon (through components) and the reference hosts allowlisted in
              `scripts/audit.py`.
            - SEO title 30-60 characters with no brand suffix; meta description 140-160.
            - If a fact cannot be verified from a primary source, leave it out and say so in the quality report.
              An article missing a specification beats one that invents it.
            - Never change `site.config.ts` (the Amazon tag and the indexing switch belong to the owner).
          # Model: set the repository variable CLAUDE_MODEL to pin a specific model; default is the Opus alias.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'opus' }}
            --max-turns 300
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite

      - name: What the run left behind
        if: always() && steps.pick.outputs.page != ''
        run: |
          git status --short || true
          git log origin/main..HEAD --oneline || true

      - name: Push the work
        id: push
        if: always() && steps.pick.outputs.page != ''
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin main
          python scripts/stamp_publish_date.py --since origin/main
          python scripts/maybe_enable_indexing.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.pick.outputs.page }}: finish the run"
          fi
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "nothing to push - the run produced no commits"; exit 0
          fi
          git log origin/main..HEAD --oneline
          if ! git pull --rebase --autostash origin main; then
            echo "::error::rebase onto origin/main failed"; git rebase --abort || true; exit 1
          fi
          git push origin main

      - name: Tell search engines (only when indexing is switched on)
        if: success() && steps.pick.outputs.page != ''
        continue-on-error: true
        run: |
          sleep 180
          node scripts/indexnow.mjs

      - name: Report
        if: always()
        run: python scripts/status.py || true

      # Leave a readable record of every run in the repo, so a Claude session (which cannot open the Actions
      # tab) can see what happened and fix it.
      - name: Record the run
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/_runs
          f="work/_runs/$(date -u +%Y-%m-%d_%H%M)-run${{ github.run_number }}.md"
          {
            echo "# Run ${{ github.run_number }} (${{ github.event_name }}) — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- Page: ${{ steps.pick.outputs.page || '(none picked)' }}"
            echo "- Pick step: ${{ steps.pick.outcome }}"
            echo "- Pipeline step: ${{ steps.pipeline.outcome || 'skipped' }}"
            echo "- Push step: ${{ steps.push.outcome || 'skipped' }}"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## What the agent reported"
            ef="${{ steps.pipeline.outputs.execution_file }}"
            if [ -n "$ef" ] && [ -f "$ef" ]; then
              echo '```'
              jq -r '.[] | select(.type=="result") | "result: \(.subtype) | turns: \(.num_turns) | error: \(.is_error)\n\(.result // "" | tostring | .[0:3000])"' "$ef" 2>/dev/null || tail -c 3000 "$ef"
              jq -r '.[] | select(.type=="system" and .subtype=="init") | "model: \(.model)"' "$ef" 2>/dev/null | head -1
              echo '```'
            else
              echo "(no execution file — the action failed before the agent started; see the Run URL)"
            fi
            echo ""
            echo "## Last commits"
            git log -5 --format='- %h %s' origin/main 2>/dev/null || true
          } > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add "$f" && git commit -q -m "Run log ${{ github.run_number }}: ${{ steps.pick.outputs.page || 'nothing' }} ${{ steps.pipeline.outcome || 'skipped' }}" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done

